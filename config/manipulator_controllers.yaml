controller_manager:
  ros__parameters:
    update_rate: 1000 # 1 kHz matches the 1ms physics step

    effort_controller:
      type: effort_controllers/JointGroupEffortController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    topic_name: /joint_states_true

effort_controller:
  ros__parameters:
    joints:
      - Link1_link_joint
      - Link2_link_joint